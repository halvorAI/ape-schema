name: Bug report
description: Something doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please use synthetic data only, and never paste API keys, card numbers or customer data. Security problems go to hello@halvorai.com instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code, command or event that shows the problem.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The schema version (for example `ape_version` 0.1) or the commit you tested.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Operating system and runtime version, if relevant.
