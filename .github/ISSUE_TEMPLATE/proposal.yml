name: Rail mapping or schema proposal
description: Propose a mapping for a new rail, a new field, or a change to the schema.
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: For anything bigger than a small fix, agreeing on scope here first saves you work. Use synthetic data only.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Who needs it, and what they can't do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Which source fields map to which APE fields? Link the rail's public specification, and include one synthetic example event if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on this?
      options:
        - Yes, I'd like to open the pull request
        - I could help with review or testing
        - No, just suggesting it
    validations:
      required: true
