<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 480" width="440" height="480" role="img" aria-labelledby="t d"><title id="t">HalvorAI records evidence beside the payment path</title><desc id="d">An AI agent pays a merchant over a payment rail such as Stripe, a card, x402 or MPP. HalvorAI is not on that path. Beside it, the HalvorAI SDK observes the payment read-only and records a signed event, events are assembled into a signed evidence pack, and the bank verifies the pack offline.</desc><style>
.bg{fill:#FBF9F4}.box{fill:#F3EFE6;stroke:#7A766C;stroke-width:1.5}.hb{fill:#F3EFE6;stroke:#4A6100;stroke-width:2.5}
.t{fill:#1C1C1C;font:600 16px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.s{fill:#5F5B52;font:400 13px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.k{fill:#5F5B52;font:600 11px 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em}
.f{fill:#1C1C1C;font:400 14px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.a{stroke:#1C1C1C;stroke-width:2;fill:none}.d{stroke:#4A6100;stroke-width:2;stroke-dasharray:6 5;fill:none}
.ah{fill:#1C1C1C}.dh{fill:#4A6100}.ok{fill:#4A6100;font:700 16px system-ui,sans-serif}.acc{fill:#4A6100}
@media (prefers-color-scheme:dark){.bg{fill:#1C1C1C}.box{fill:#262624;stroke:#7A766C}.hb{fill:#262624;stroke:#C6F432}
.t,.f{fill:#F3EFE6}.s,.k{fill:#A39E91}.a{stroke:#F3EFE6}.ah{fill:#F3EFE6}.d{stroke:#C6F432}.dh,.acc{fill:#C6F432}.ok{fill:#C6F432}}
</style><rect class="bg" width="440" height="480" rx="14"/><text class="k" x="24" y="52">PAYMENT PATH</text><text class="k" x="232" y="52">EVIDENCE</text><rect class="box" x="24" y="78" width="184" height="66" rx="10"/><text class="t" x="40" y="106">AI agent</text><text class="s" x="40" y="128">pays for an owner</text><rect class="hb" x="232" y="78" width="184" height="66" rx="10"/><text class="t" x="248" y="106">HalvorAI SDK</text><text class="s" x="248" y="128">signs each event</text><line class="a" x1="116.0" y1="148" x2="116.0" y2="201"/><path class="ah" d="M116.0 210 l-6 -11 h12z"/><line class="a" x1="324.0" y1="148" x2="324.0" y2="201"/><path class="ah" d="M324.0 210 l-6 -11 h12z"/><rect class="box" x="24" y="214" width="184" height="66" rx="10"/><text class="t" x="40" y="242">Payment rail</text><text class="s" x="40" y="264">Stripe · card · x402</text><rect class="box" x="232" y="214" width="184" height="66" rx="10"/><text class="t" x="248" y="242">Evidence pack</text><text class="s" x="248" y="264">signed, hash-chained</text><line class="a" x1="116.0" y1="284" x2="116.0" y2="337"/><path class="ah" d="M116.0 346 l-6 -11 h12z"/><line class="a" x1="324.0" y1="284" x2="324.0" y2="337"/><path class="ah" d="M324.0 346 l-6 -11 h12z"/><rect class="box" x="24" y="350" width="184" height="66" rx="10"/><text class="t" x="40" y="378">Merchant</text><text class="s" x="40" y="400">gets paid</text><rect class="box" x="232" y="350" width="184" height="66" rx="10"/><text class="t" x="248" y="378">Your bank</text><text class="s" x="248" y="400">verifies offline</text><text class="ok" x="386" y="379">✓</text><line class="d" x1="210" y1="111.0" x2="221" y2="111.0"/><path class="dh" d="M230 111.0 l-11 -6 v12z"/><text class="s" x="24" y="456">The SDK observes read-only. HalvorAI is never</text><text class="s" x="24" y="476">in the payment path and cannot slow or block it.</text></svg>
