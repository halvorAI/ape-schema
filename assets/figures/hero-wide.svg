<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d"><title id="t">HalvorAI records evidence beside the payment path</title><desc id="d">An AI agent pays a merchant over a payment rail such as Stripe, a card, x402 or MPP. HalvorAI is not on that path. Beside it, the HalvorAI SDK observes the payment read-only and records a signed event, events are assembled into a signed evidence pack, and the bank verifies the pack offline.</desc><style>
.bg{fill:#FBF9F4}.box{fill:#F3EFE6;stroke:#7A766C;stroke-width:1.5}.hb{fill:#F3EFE6;stroke:#4A6100;stroke-width:2.5}
.t{fill:#1C1C1C;font:600 16px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.s{fill:#5F5B52;font:400 13px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.k{fill:#5F5B52;font:600 11px 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em}
.f{fill:#1C1C1C;font:400 14px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.a{stroke:#1C1C1C;stroke-width:2;fill:none}.d{stroke:#4A6100;stroke-width:2;stroke-dasharray:6 5;fill:none}
.ah{fill:#1C1C1C}.dh{fill:#4A6100}.ok{fill:#4A6100;font:700 16px system-ui,sans-serif}.acc{fill:#4A6100}
@media (prefers-color-scheme:dark){.bg{fill:#1C1C1C}.box{fill:#262624;stroke:#7A766C}.hb{fill:#262624;stroke:#C6F432}
.t,.f{fill:#F3EFE6}.s,.k{fill:#A39E91}.a{stroke:#F3EFE6}.ah{fill:#F3EFE6}.d{stroke:#C6F432}.dh,.acc{fill:#C6F432}.ok{fill:#C6F432}}
</style><rect class="bg" width="960" height="360" rx="14"/><text class="k" x="40" y="44">PAYMENT PATH</text><rect class="box" x="40" y="60" width="256" height="66" rx="10"/><text class="t" x="56" y="88">AI agent</text><text class="s" x="56" y="110">pays on an owner's behalf</text><rect class="box" x="352" y="60" width="256" height="66" rx="10"/><text class="t" x="368" y="88">Payment rail</text><text class="s" x="368" y="110">Stripe · card · x402 · MPP</text><rect class="box" x="664" y="60" width="256" height="66" rx="10"/><text class="t" x="680" y="88">Merchant</text><text class="s" x="680" y="110">gets paid, nothing added</text><line class="a" x1="300" y1="93.0" x2="339" y2="93.0"/><path class="ah" d="M348 93.0 l-11 -6 v12z"/><line class="a" x1="612" y1="93.0" x2="651" y2="93.0"/><path class="ah" d="M660 93.0 l-11 -6 v12z"/><text class="k" x="40" y="190">EVIDENCE, BESIDE THE PATH</text><line class="d" x1="260" y1="130" x2="260" y2="193"/><path class="dh" d="M260 202 l-6 -11 h12z"/><text class="s" x="272" y="170">observes, read-only</text><rect class="hb" x="40" y="206" width="256" height="66" rx="10"/><text class="t" x="56" y="234">HalvorAI SDK</text><text class="s" x="56" y="256">signs one event per payment</text><rect class="box" x="352" y="206" width="256" height="66" rx="10"/><text class="t" x="368" y="234">Evidence pack</text><text class="s" x="368" y="256">signed manifest, hash chain</text><rect class="box" x="664" y="206" width="256" height="66" rx="10"/><text class="t" x="680" y="234">Your bank</text><text class="s" x="680" y="256">verifies offline, no trust in us</text><text class="ok" x="890" y="235">✓</text><line class="a" x1="300" y1="239.0" x2="339" y2="239.0"/><path class="ah" d="M348 239.0 l-11 -6 v12z"/><line class="a" x1="612" y1="239.0" x2="651" y2="239.0"/><path class="ah" d="M660 239.0 l-11 -6 v12z"/><text class="f" x="40" y="326">HalvorAI is never in the payment path. It cannot slow or block a payment.</text></svg>
