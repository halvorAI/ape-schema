<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d"><title id="t">The shape of an Agent Payment Event</title><desc id="d">One APE event inside a signed envelope. Header fields: ape_version, id, type, occurred_at, environment. Who paid: agent and owner (required), instruction. What was paid: payment and payee (required), instrument. Proof: source (required, who signed) and evidence, the network proofs attached verbatim such as an AP2 mandate, Verifiable Intent, a Visa TAP signature or an x402 payload. Links: related and labels. The envelope's sig is a detached JWS (EdDSA) over the JCS canonical form of the event.</desc><style>
.bg{fill:#FBF9F4}.box{fill:#F3EFE6;stroke:#7A766C;stroke-width:1.5}.hb{fill:#F3EFE6;stroke:#4A6100;stroke-width:2.5}
.t{fill:#1C1C1C;font:600 16px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.s{fill:#5F5B52;font:400 13px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.k{fill:#5F5B52;font:600 11px 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em}
.f{fill:#1C1C1C;font:400 14px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.a{stroke:#1C1C1C;stroke-width:2;fill:none}.d{stroke:#4A6100;stroke-width:2;stroke-dasharray:6 5;fill:none}
.ah{fill:#1C1C1C}.dh{fill:#4A6100}.ok{fill:#4A6100;font:700 16px system-ui,sans-serif}.acc{fill:#4A6100}
@media (prefers-color-scheme:dark){.bg{fill:#1C1C1C}.box{fill:#262624;stroke:#7A766C}.hb{fill:#262624;stroke:#C6F432}
.t,.f{fill:#F3EFE6}.s,.k{fill:#A39E91}.a{stroke:#F3EFE6}.ah{fill:#F3EFE6}.d{stroke:#C6F432}.dh,.acc{fill:#C6F432}.ok{fill:#C6F432}}
</style><rect class="bg" width="960" height="430" rx="14"/><text class="k" x="40" y="44">SIGNED ENVELOPE</text><rect class="box" x="40" y="58" width="880" height="292" rx="12"/><text class="k" x="60" y="86">EVENT</text><text class="s" x="60" y="110">ape_version* · id* · type* · occurred_at* · environment*</text><text class="k" x="60" y="140">WHO PAID</text><rect class="box" x="60" y="152" width="200" height="52" rx="10"/><text class="t" x="76" y="174">agent*</text><text class="s" x="76" y="194">id, name, framework, key</text><rect class="box" x="60" y="214" width="200" height="52" rx="10"/><text class="t" x="76" y="236">owner*</text><text class="s" x="76" y="256">person or business</text><rect class="box" x="60" y="276" width="200" height="52" rx="10"/><text class="t" x="76" y="298">instruction</text><text class="s" x="76" y="318">hash, optional summary</text><text class="k" x="273" y="140">WHAT WAS PAID</text><rect class="box" x="273" y="152" width="200" height="52" rx="10"/><text class="t" x="289" y="174">payment*</text><text class="s" x="289" y="194">rail, amount, status, rail_ref</text><rect class="box" x="273" y="214" width="200" height="52" rx="10"/><text class="t" x="289" y="236">payee*</text><text class="s" x="289" y="256">merchant, API, wallet</text><rect class="box" x="273" y="276" width="200" height="52" rx="10"/><text class="t" x="289" y="298">instrument</text><text class="s" x="289" y="318">card token or wallet</text><text class="k" x="486" y="140">PROOF</text><rect class="hb" x="486" y="152" width="200" height="52" rx="10"/><text class="t" x="502" y="174">source*</text><text class="s" x="502" y="194">who signed this event</text><rect class="hb" x="486" y="214" width="200" height="52" rx="10"/><text class="t" x="502" y="236">evidence[]</text><text class="s" x="502" y="256">network proofs, verbatim</text><text class="k" x="699" y="140">LINKS</text><rect class="box" x="699" y="152" width="200" height="52" rx="10"/><text class="t" x="715" y="174">related</text><text class="s" x="715" y="194">previous, corrected</text><rect class="box" x="699" y="214" width="200" height="52" rx="10"/><text class="t" x="715" y="236">labels</text><text class="s" x="715" y="256">your own keys</text><rect class="hb" x="40" y="370" width="880" height="40" rx="10"/><text class="t" x="60" y="396">sig</text><text class="s" x="96" y="396">detached JWS, EdDSA, over the JCS canonical event. Receivers chain events.</text><text class="s" x="800" y="44">* required</text></svg>
